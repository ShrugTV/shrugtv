# Memory for javac/D8 with about 6000 decompiled classes
# user.language=en: English javac messages so that they can be evaluated by machine
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
# The daemon ends by itself after 20 minutes without work: warm for the next build, not forever
org.gradle.daemon.idletimeout=1200000
android.useAndroidX=true
android.nonTransitiveRClass=false
