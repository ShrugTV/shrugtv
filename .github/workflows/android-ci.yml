name: Android CI

# Unit tests and a debug build (docs/bug_review.md B24). The Twitch client ID is not needed for
# either: the debug build only warns without it. Lint and ktlint/detekt are not configured.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
